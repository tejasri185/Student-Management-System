<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Registration</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>

<body>
	<th:block th:replace="fragments/header :: *"></th:block>

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">

            <h2 class="text-center mb-4">Create New Account</h2>

            <!-- Error if email already exists -->
            <div th:if="${param.error}" class="alert alert-danger">
                Email already exists. Try another email.
            </div>

            <!-- Registration success (comes from redirect:/login?registered) -->
            <div th:if="${param.success}" class="alert alert-success">
                Registration completed! Please login.
            </div>

            <form th:action="@{/register/save}" th:object="${user}" method="post">

                <div class="form-group">
                    <label>Full Name</label>
                    <input th:field="*{name}" class="form-control" placeholder="Enter name" required />
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input th:field="*{email}" type="email" class="form-control" placeholder="Enter email" required />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input th:field="*{password}" type="password" class="form-control" placeholder="Enter password" required />
                </div>

                <button type="submit" class="btn btn-primary btn-block">Register</button>

                <p class="text-center mt-3">
                    Already have an account? <a href="/login">Login</a>
                </p>

            </form>

        </div>
    </div>
</div>

</body>

</html>
