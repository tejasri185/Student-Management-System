<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<!-- ✅ Include Navbar -->
<th:block th:replace="fragments/header :: *"></th:block>

<div class="container mt-4">
    <div class="card shadow-lg p-4">

        <h2 class="text-center mb-4">Add New Student</h2>

        <!-- Student Form -->
        <form th:action="@{/students/save}" th:object="${student}" method="post">

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course</label>
                <input type="text" class="form-control" th:field="*{course}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Fee</label>
                <input type="number" class="form-control" th:field="*{fee}" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary px-4">Save</button>
                <a th:href="@{/students}" class="btn btn-secondary px-4 ms-2">Cancel</a>
            </div>

        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
