<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Student Management System</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #e0f2ff 0, #f9fafb 45%, #ffffff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #ffffffcc;
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 32px 40px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.15);
            text-align: center;
            max-width: 540px;
            width: 100%;
        }
        h1 {
            font-size: 34px;
            margin: 0 0 8px;
            color: #0f172a;
            letter-spacing: 0.04em;
        }
        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
        }
        .btn-outline {
            background: #f9fafb;
            color: #1f2933;
            border: 1px solid #e5e7eb;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18);
        }
        .chips {
            margin-top: 18px;
            font-size: 11px;
            color: #9ca3af;
        }
        @media (max-width: 600px) {
            .card {
                margin: 0 16px;
                padding: 24px 20px;
            }
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Student Management System</h1>
    <div class="subtitle">
        Manage students, view records and keep everything organized in one place.
    </div>

    <div class="buttons">
        <!-- Login -->
        <a th:href="@{/login}" class="btn btn-primary">Login</a>

        <!-- Register -->
        <a th:href="@{/register}" class="btn btn-outline">Register</a>

        <!-- Dashboard (requires login) -->
        <a th:href="@{/dashboard}" class="btn btn-outline">Dashboard</a>

        <!-- View List (students) – requires login -->
        <a th:href="@{/students}" class="btn btn-outline">View Students</a>
    </div>

    <div class="chips">
        Use Login / Register to continue. Dashboard and View Students need authentication.
    </div>
</div>
</body>
</html>
